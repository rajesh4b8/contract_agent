# Ground truth for the evaluation set.
#
# Each contract lists the playbook rules a correct review should raise. These
# three are synthetic on purpose: the breaches are written into the text, so the
# right answer is a matter of construction rather than opinion. That is what
# makes the score meaningful — a labelled real contract would need a lawyer, not
# an engineer, and guessing at one would produce a number that looks objective
# and is not.
#
# `late-breaches` is the one that makes coverage measurable: its breaches sit
# past the truncation window the analyser used to impose, so it is the only
# fixture that can fail when the system silently ignores most of a document.
#
# `clean` is the one that matters most. Anything can score well on a document
# stuffed with breaches; only a compliant contract shows whether the system
# invents violations that are not there.
#
# Rule ids refer to data/playbooks/default_playbook.yaml.

contracts:
  - file: breaching.pdf
    description: >-
      Every clause drafted to breach. Net 90 payment, a fixed $50k liability cap
      unconnected to fees, indemnity covering the other party's own negligence,
      immediate termination with no payment for work in progress, and assignment
      of the provider's pre-existing IP.
    expected_rules: [PAY-001, LIA-001, LIA-002, IND-001, TRM-001, IPR-001]
    notes: >-
      CON-001 is deliberately absent from the expectation. There is no
      confidentiality clause in the document, and the checker evaluates clauses
      that exist rather than detecting missing ones — so flagging it would be a
      false positive today. Detecting absent-but-required clauses is a separate
      capability, and this label records that it is not claimed.

  - file: partial.pdf
    description: >-
      Compliant except for two clauses: Net 60 payment, and immediate
      termination without notice or payment for work in progress.
    expected_rules: [PAY-001, TRM-001]
    notes: >-
      The discriminating case. Liability, indemnity, IP and confidentiality are
      all drafted to the playbook, so anything raised against them is a false
      positive.

  - file: late-breaches.pdf
    description: >-
      The same two breaches as `partial` — Net 60 payment, and immediate
      termination with no payment for work in progress — but placed after
      forty-six clauses of ordinary compliant boilerplate, so the first one sits
      at character 16,139 of a 17,097-character document.
    expected_rules: [PAY-001, TRM-001]
    notes: >-
      The fixture that makes Increment 8 measurable. `ClauseDetectorTool` used to
      send `contract_text[:12000]`, so both breaches were past the end of what
      the model ever saw and a correct-looking review reported zero violations.
      Every other fixture here is under 1,400 characters and fits inside that
      window, which is why `make eval` scored 1.00 across the board and could not
      have failed on this. Recall on this fixture is 0.00 with truncation and
      1.00 without; that difference is the increment.

  - file: clean.pdf
    description: >-
      Drafted to comply with every rule in the playbook.
    expected_rules: []
    notes: >-
      A correct review raises nothing. This is the only fixture that can fail by
      the system being too eager, which is the failure mode a demo never shows.
