[pytest]
# Run from the repo root so `backend.*` imports resolve for both test trees.
testpaths = backend/tests tests
python_files = test_*.py
asyncio_mode = auto
addopts = -q --strict-markers -m "not integration"
markers =
    integration: needs a live Neo4j, API keys, or a running server. Excluded from
        the default run; use `make test-integration` once services are up.
