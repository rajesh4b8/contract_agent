services:
  backend:
    build:
      context: ./backend
    environment:
      # The root .env is not copied into the image, so anything the app reads
      # from the environment has to be listed here. ENVIRONMENT was missing,
      # which meant the container always ran as `development`: RBAC never
      # failed closed to VIEWER, and the debug event stream's production gate
      # could not fire.
      - ENVIRONMENT=${ENVIRONMENT-development}
      - NEO4J_URI=${NEO4J_URI-bolt://neo4j:7687}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD-contractdev}
      - NEO4J_USERNAME=${NEO4J_USERNAME-neo4j}
      - NEO4J_DATABASE=${NEO4J_DATABASE-neo4j}
      - OPENAI_API_KEY=${OPENAI_API_KEY-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY-}
      - OPENROUTER_SMALL_MODEL=${OPENROUTER_SMALL_MODEL-}
      - OPENROUTER_LARGE_MODEL=${OPENROUTER_LARGE_MODEL-}
      - OPENROUTER_LONG_MODEL=${OPENROUTER_LONG_MODEL-}
      - GEMINI_FLASH_LITE_MODEL=${GEMINI_FLASH_LITE_MODEL-gemini-flash-lite-latest}
      - GEMINI_FLASH_MODEL=${GEMINI_FLASH_MODEL-gemini-flash-latest}
      - GEMINI_PRO_MODEL=${GEMINI_PRO_MODEL-gemini-pro-latest}
      - DEFAULT_MODEL_ID=${DEFAULT_MODEL_ID-gemini-flash}
      - LOG_LEVEL=${LOG_LEVEL-INFO}
      - DEBUG_EVENTS=${DEBUG_EVENTS-false}
      - PHOENIX_COLLECTOR_ENDPOINT=http://phoenix:6006/v1/traces
    depends_on:
      neo4j:
        condition: service_healthy
    networks:
      - net
    # `uvicorn --reload` rather than the image's `fastapi dev`, for one reason:
    # `--reload-exclude`. Editing a test file restarted the server, and a reload
    # occasionally kills the worker without starting a replacement — so writing
    # a test could take the API down for anyone using the app. Tests are not
    # imported by the server; they have no business restarting it.
    command:
      - uv
      - run
      - uvicorn
      - backend.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - backend
      - --reload-exclude
      - backend/tests/*
      - --reload-exclude
      - "*/__pycache__/*"
    volumes:
      # Live-mount source so the reloader picks up host edits without
      # rebuilding the image. Keeps container deps (/app/.venv) intact.
      - ./backend:/app/backend
    ports:
      - 8000:8000
    # `fastapi dev`'s reloader can kill its worker and fail to start a
    # replacement — seen after a bulk file change, such as a git checkout or
    # rebase rewriting several files at once. The reloader process survives, so
    # without this the container still reports "Up" while answering nothing, and
    # the UI just spins. Now `docker ps` says `unhealthy`, and the fix is
    # `docker compose restart backend`.
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/models', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
  ui:
    build:
      context: ./frontend
    environment:
      - VITE_BACKEND_URL=${VITE_BACKEND_URL-http://backend:8000}
    networks:
      - net
    volumes:
      # Live-mount source for Vite HMR. The anonymous volume keeps the
      # container's /app/node_modules from being shadowed by the host's.
      - ./frontend:/app
      - /app/node_modules
    ports:
      - 3000:5173
  phoenix:
    image: arizephoenix/phoenix:latest
    ports:
      - 6006:6006
      - 4317:4317
    networks:
      - net
  neo4j:
    image: neo4j:5-community
    environment:
      - NEO4J_AUTH=${NEO4J_USERNAME-neo4j}/${NEO4J_PASSWORD-contractdev}
      - NEO4J_PLUGINS=["apoc"]
    ports:
      - 7474:7474
      - 7687:7687
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - net

networks:
  net:

volumes:
  neo4j_data: